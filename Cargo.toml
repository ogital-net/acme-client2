[package]
name = "acme-client2"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "BSD-2-Clause"
repository = "https://github.com/ogital-net/acme-client2"
homepage = "https://github.com/ogital-net/acme-client2"
description = "Asynchronous ACME certificate issuance with application-owned HTTP-01 challenges"
keywords = ["acme", "tls", "certificate", "https"]
categories = ["authentication", "network-programming"]
readme = "README.md"
include = ["src/**", "tests/**", "scripts/**", "README.md", "Cargo.toml"]

[dependencies]
base64-simd = "0.8"
bytes = "1"
certutils = { version = "0.1", features = ["jose4rs"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
jose4rs = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
tokio-aws-lc = { version = "0.3", features = ["hyper"] }

[dev-dependencies]
hyper = { version = "1", features = ["server"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
